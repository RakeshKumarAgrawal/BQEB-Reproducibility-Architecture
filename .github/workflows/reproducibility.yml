name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run deterministic example
        run: python code/reproducibility/deterministic_computation.py --seed 42 --out results/ci-output.json
      - name: Run available tests
        run: python -m pytest code/checksum/test_verify_manifest.py
